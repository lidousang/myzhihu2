name: myzhihu2-local

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    # The Go API currently runs on the host and connects to 127.0.0.1:3306.
    # Keep the published database port private to this machine.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deployment/.env}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myzhihu}
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in deployment/.env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deployment/.env}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # The Go API currently runs directly on the host and uses 127.0.0.1:6379.
    # Binding to loopback avoids exposing this development cache to the LAN.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped
    # The AMQP port is used by the Go backend; 15672 is the local admin UI.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-myzhihu2}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-myzhihu2}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
