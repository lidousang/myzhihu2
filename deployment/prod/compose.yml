name: myzhihu2

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: myzhihu
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      TZ: Asia/Shanghai
    command:
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=60
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      retries: 12
      start_period: 40s
    deploy: { resources: { limits: { memory: 700M } } }
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
    deploy: { resources: { limits: { memory: 300M } } }
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.3.6-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD:?}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      start_period: 30s
    deploy: { resources: { limits: { memory: 400M } } }
    logging: *logging

  backend:
    build: ./backend
    image: myzhihu2-backend:latest
    restart: unless-stopped
    volumes:
      - ./backend/settings.prod.yaml:/app/settings.yaml:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256M } } }
    logging: *logging

  seed:
    image: myzhihu2-backend:latest
    entrypoint: ["/app/seed"]
    command: ["-f", "/app/settings.yaml", "-profile", "demo", "-seed", "20261107", "-reset", "-purge-queues"]
    volumes:
      - ./backend/settings.prod.yaml:/app/settings.yaml:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    profiles: ["tools"]
    restart: "no"
    logging: *logging

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    logging: *logging

volumes:
  mysql_data: {}
  redis_data: {}
  rabbitmq_data: {}

