<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问题详情 - 仿知乎</title>
  <style>
    /* 全局样式继承与重置 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f6f6f6;
      color: #121212;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* 1. 顶部导航栏 */
    .header {
      position: sticky; top: 0; z-index: 100;
      background-color: #ffffff;
      box-shadow: 0 1px 3px rgba(18, 18, 18, 0.1);
      height: 52px;
    }
    .header-inner {
      max-width: 1000px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 100%; padding: 0 16px;
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .logo { font-size: 26px; font-weight: bold; color: #056de8; }
    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { font-size: 15px; color: #8590a6; font-weight: 500; }
    .nav-links a.active, .nav-links a:hover { color: #121212; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .search-box {
      background-color: #f6f6f6; border: 1px solid #e7e7e7;
      border-radius: 99px; padding: 6px 16px; display: flex; align-items: center; width: 240px;
    }
    .search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; background-color: #056de8;
      color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold;
    }

    /* 2. 问题头部卡片 (Question Header Card) */
    .question-header {
      background-color: #ffffff;
      box-shadow: 0 1px 3px rgba(18, 18, 18, 0.1);
      padding: 16px 0;
      margin-bottom: 10px;
    }
    .question-header-inner {
      max-width: 1000px; margin: 0 auto; padding: 0 16px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .question-main-info { flex: 1; padding-right: 24px; }
    .topic-tags { display: flex; gap: 8px; margin-bottom: 12px; }
    .tag {
      background-color: rgba(5, 109, 232, 0.1); color: #056de8;
      padding: 2px 12px; border-radius: 100px; font-size: 13px; font-weight: 500;
    }
    .question-title { font-size: 22px; font-weight: 600; color: #121212; margin-bottom: 16px; }
    .question-actions { display: flex; gap: 12px; align-items: center; }
    .btn-blue {
      background-color: #056de8; color: #fff; border: none;
      padding: 8px 16px; border-radius: 3px; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn-outline {
      background-color: transparent; color: #056de8; border: 1px solid #056de8;
      padding: 8px 16px; border-radius: 3px; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .question-metrics {
      display: flex; gap: 24px; text-align: right; border-left: 1px solid #f0f0f0; padding-left: 24px;
    }
    .metric-item .number { font-size: 18px; font-weight: 600; color: #121212; }
    .metric-item .label { font-size: 13px; color: #8590a6; }

    /* 3. 页面主体容器 */
    .container {
      max-width: 1000px; margin: 0 auto 20px;
      display: flex; gap: 10px; padding: 0 16px;
    }
    .main-content { flex: 1; min-width: 0; }
    .sidebar { width: 296px; display: flex; flex-direction: column; gap: 10px; }

    .card {
      background-color: #ffffff; border-radius: 2px;
      box-shadow: 0 1px 3px rgba(18, 18, 18, 0.1); padding: 16px 20px; margin-bottom: 10px;
    }

    /* 4. 回答列表与回答卡片 */
    .answers-count-bar {
      font-size: 15px; font-weight: 600; color: #8590a6;
      padding: 12px 20px; background: #fff; border-bottom: 1px solid #f0f0f0;
    }
    .answer-card { display: flex; flex-direction: column; gap: 12px; }
    .author-info { display: flex; align-items: center; gap: 12px; }
    .author-avatar { width: 38px; height: 38px; border-radius: 50%; background-color: #ddd; }
    .author-detail { display: flex; flex-direction: column; }
    .author-name { font-size: 15px; font-weight: 600; color: #121212; }
    .author-bio { font-size: 13px; color: #8590a6; }
    .voted-info { font-size: 13px; color: #8590a6; margin-top: 4px; }

    .answer-content {
      font-size: 15px; color: #121212; line-height: 1.8; margin-top: 8px;
    }
    .answer-meta { font-size: 13px; color: #8590a6; margin-top: 12px; }

    .post-actions { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
    .btn-vote {
      background-color: rgba(5, 109, 232, 0.1); color: #056de8; border: none;
      border-radius: 3px; padding: 6px 12px; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .action-link { font-size: 14px; color: #8590a6; cursor: pointer; background: none; border: none; }

    /* 侧边栏作者信息 */
    .author-card-header { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .author-stats { display: flex; justify-content: space-around; text-align: center; margin: 16px 0; }
    .stat-num { font-size: 16px; font-weight: 600; color: #121212; }
    .stat-text { font-size: 12px; color: #8590a6; }
  </style>
</head>
